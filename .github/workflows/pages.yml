# Baut die Plattform aus inhalte/ und legt das Ergebnis in den Branch gh-pages.
# GitHub Pages (Settings → Pages → Deploy from a branch: gh-pages / root) veröffentlicht es
# danach automatisch unter https://rroollii.github.io/flugschein/.
# Audiodateien (natürliche Stimmen) kommen aus dem Branch `audio` und landen unter gh-pages/audio/.
name: Plattform bauen (gh-pages)

on:
  push:
    branches: [main, audio]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/buchstabiertrainer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Plattform bauen
        run: npm run build
        env:
          CONTENT_DIR: inhalte
          OUT_DIR: _site
          BASE_PATH: /flugschein/
      # Eigenständige Expo-App (iOS/Android/Web) → https://rroollii.github.io/flugschein/buchstabiertrainer/
      - name: Buchstabiertrainer (Web) bauen
        working-directory: apps/buchstabiertrainer
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build:web
          rm -rf ../../_site/buchstabiertrainer
          cp -a dist ../../_site/buchstabiertrainer
          du -sh ../../_site/buchstabiertrainer
      - name: Audio aus Branch audio übernehmen (falls vorhanden)
        run: |
          if git ls-remote --exit-code --heads origin audio >/dev/null; then
            git fetch --depth 1 origin audio
            git worktree add ../audio-src FETCH_HEAD
            rm -rf _site/audio
            # Pfade im Manifest ("datei": "audio/<stimme>/…") sind relativ zur Seitenwurzel → audio/ + manifest.json nach _site/audio/
            cp -a ../audio-src/audio _site/audio
            cp ../audio-src/manifest.json _site/audio/manifest.json
            rm -f _site/audio/index.json _site/audio/.git
            du -sh _site/audio; ls _site/audio
          else
            echo "Kein Branch audio – nur Gerätestimme."
          fi
      # gh-pages besteht immer nur aus einem Commit ohne Vorgänger: alte Audio-Versionen bleiben so nicht über den
      # Verlauf erreichbar, und es wird nie der ganze Branch geladen (Abgleich über Partial-Fetch ohne Blobs).
      # Die MP3-Blobs sind identisch mit denen im Branch audio → der Push überträgt nur Geändertes.
      - name: Nach gh-pages veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          rm -f _site/BUILD-INFO.txt
          touch _site/.nojekyll
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages.index"
          git --work-tree=_site add -A
          TREE=$(git write-tree)
          ALT=""
          if git fetch -q --depth 1 --filter=blob:none origin gh-pages; then ALT=$(git rev-parse 'FETCH_HEAD^{tree}'); fi
          if [ "$TREE" = "$ALT" ]; then echo "Keine Änderungen am Build."; exit 0; fi
          COMMIT=$(git commit-tree "$TREE" -m "Build von ${GITHUB_SHA::7}")
          git push -f origin "$COMMIT:refs/heads/gh-pages"

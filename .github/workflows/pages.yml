# Baut die Plattform aus inhalte/ und legt das Ergebnis in den Branch gh-pages.
# GitHub Pages (Settings → Pages → Deploy from a branch: gh-pages / root) veröffentlicht es
# danach automatisch unter https://rroollii.github.io/flugschein/.
# Audiodateien (natürliche Stimmen) kommen aus dem Branch `audio` und landen unter gh-pages/audio/.
name: Plattform bauen (gh-pages)

on:
  push:
    branches: [main, audio]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Plattform bauen
        run: npm run build
        env:
          CONTENT_DIR: inhalte
          OUT_DIR: _site
          BASE_PATH: /flugschein/
      - name: Audio aus Branch audio übernehmen (falls vorhanden)
        run: |
          if git ls-remote --exit-code --heads origin audio >/dev/null; then
            git fetch --depth 1 origin audio
            git worktree add ../audio-src FETCH_HEAD
            rm -rf _site/audio
            if [ -d ../audio-src/audio ]; then cp -a ../audio-src/audio _site/audio; else mkdir -p _site/audio && (cd ../audio-src && tar --exclude=.git -cf - .) | tar -xf - -C _site/audio; fi
            rm -f _site/audio/.git
            du -sh _site/audio
          else
            echo "Kein Branch audio – nur Gerätestimme."
          fi
      - name: Nach gh-pages veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../pages origin/gh-pages
          find ../pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. ../pages/
          rm -f ../pages/BUILD-INFO.txt
          touch ../pages/.nojekyll
          cd ../pages
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen am Build."; exit 0; fi
          git commit -m "Build von ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
